<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slot Tools Hub</title>
<script>
(function(){
  var theme = 'dark';
  try { if (localStorage.getItem('slotToolsHubTheme') === 'light') theme = 'light'; } catch(e) {}
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f6f2ea' : '#0b0b0d');
})();
</script>
<style>
:root{
  --bg:#0b0b0d;
  --panel:#16161a;
  --panel2:#1d1d22;
  --line:#2a2a31;
  --text:#f7f5ef;
  --muted:#9999a5;
  --gold:#c8941a;
  --gold2:#e4bd61;
  --page-glow:rgba(200,148,26,.18);
  --page-top:#0b0b0d;
  --page-bottom:#111114;
  --hero-top:#1d1a14;
  --hero-bottom:#151518;
  --hero-line:#403721;
  --tool-bottom:#141417;
  --tool-shadow:rgba(0,0,0,.18);
  --tool-halo:rgba(200,148,26,.08);
  --icon-bg:#262219;
  --icon-line:#4d4026;
  --note:#61616b;
  --switch-bg:#1d1d22;
  --switch-active:#3c3020;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f6f2ea;
  --panel:#fffdf8;
  --panel2:#ffffff;
  --line:#ded5c6;
  --text:#28251e;
  --muted:#756e62;
  --gold:#9a6916;
  --gold2:#8b5d0b;
  --page-glow:rgba(218,173,83,.20);
  --page-top:#fffaf1;
  --page-bottom:#f4eee4;
  --hero-top:#fff8e9;
  --hero-bottom:#fffdf8;
  --hero-line:#e9d7ad;
  --tool-bottom:#faf5eb;
  --tool-shadow:rgba(87,62,26,.09);
  --tool-halo:rgba(200,148,26,.09);
  --icon-bg:#fff1d2;
  --icon-line:#e9d5a8;
  --note:#8a8073;
  --switch-bg:#ece4d7;
  --switch-active:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at 50% -10%,var(--page-glow),transparent 34%),
    linear-gradient(180deg,var(--page-top) 0%,var(--page-bottom) 100%);
}
.shell{
  width:min(100%,560px);
  margin:auto;
  padding:calc(22px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 2px 22px;
}
.eyebrow{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--gold2);
  font-weight:800;
}
.title{
  font-size:29px;
  font-weight:900;
  margin-top:3px;
}
.theme-switch{
  display:flex;
  gap:3px;
  padding:4px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--switch-bg);
  flex-shrink:0;
}
.theme-switch button{
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  padding:9px 10px;
  line-height:1.2;
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.theme-switch button[aria-pressed="true"]{
  background:var(--switch-active);
  color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}
.theme-switch button:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}
.hero{
  background:linear-gradient(145deg,var(--hero-top),var(--hero-bottom));
  border:1px solid var(--hero-line);
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
}
.hero strong{font-size:17px}
.hero p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.tool{
  position:relative;
  min-height:190px;
  padding:18px;
  background:linear-gradient(160deg,var(--panel2),var(--tool-bottom));
  border:1px solid var(--line);
  border-radius:22px;
  text-decoration:none;
  color:var(--text);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  box-shadow:0 12px 32px var(--tool-shadow);
}
.tool:active{transform:scale(.985)}
.tool:before{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  right:-34px;
  top:-34px;
  background:var(--tool-halo);
}
.icon{
  width:49px;
  height:49px;
  border-radius:15px;
  background:var(--icon-bg);
  border:1px solid var(--icon-line);
  display:grid;
  place-items:center;
  font-size:24px;
}
.tool strong{
  display:block;
  font-size:17px;
  line-height:1.35;
  margin-bottom:6px;
}
.tool span{
  display:block;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}
.arrow{
  color:var(--gold2);
  font-size:19px;
  margin-top:9px;
}
.note{
  text-align:center;
  color:var(--note);
  font-size:10px;
  line-height:1.7;
  margin-top:24px;
}
@media(max-width:380px){
  .eyebrow{font-size:9px;letter-spacing:.12em}
  .theme-switch button{padding:8px 7px;font-size:10px}
  .grid{grid-template-columns:1fr}
  .tool{min-height:154px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <div class="eyebrow">PRIVATE TOOL PORTAL</div>
      <div class="title">ホーム</div>
    </div>
    <div class="theme-switch" role="group" aria-label="画面の表示モード">
      <button type="button" data-theme-choice="light" aria-pressed="false">☀️ ライト</button>
      <button type="button" data-theme-choice="dark" aria-pressed="true">🌙 ダーク</button>
    </div>
  </div>

  <div class="hero">
    <strong>業務ツール一覧</strong>
    
  </div>

  <div class="grid">
    <a class="tool" href="./formatter.html?v=20260913">
      <div class="icon">⌨️</div>
      <div>
        <strong>パチスロ<br>フォーマッター</strong>
        <span>シート入力を解析して<br>出力データを自動生成</span>
        <div class="arrow">→</div>
      </div>
    </a>

    <a class="tool" href="./karakuri2.html?v=20260907-portal-return">
      <div class="icon">🎪</div>
      <div>
        <strong>からサー2<br>判定ツール</strong>
        <span>一枚絵・ワイプ・ステージから<br>続行ラインを判定</span>
        <div class="arrow">→</div>
      </div>
    </a>

    <a class="tool" href="./dashboard.html?v=20260913">
      <div class="icon">📊</div>
      <div>
        <strong>稼働<br>ダッシュボード</strong>
        <span>実収支・期待値・エクセル収支を<br>カレンダーで自動集計</span>
        <div class="arrow">→</div>
      </div>
    </a>
  </div>

  <div class="note">GitHub Pages対応</div>
</div>
<script>
(function(){
  var buttons = document.querySelectorAll('[data-theme-choice]');
  function setTheme(theme, save){
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f6f2ea' : '#0b0b0d');
    buttons.forEach(function(button){
      button.setAttribute('aria-pressed', String(button.getAttribute('data-theme-choice') === theme));
    });
    if (save) {
      try { localStorage.setItem('slotToolsHubTheme', theme); } catch(e) {}
    }
  }
  buttons.forEach(function(button){
    button.addEventListener('click', function(){ setTheme(button.getAttribute('data-theme-choice'), true); });
  });
  setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark', false);
})();
</script>
</body>
</html>
