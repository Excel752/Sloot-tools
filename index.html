<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slot Tools Hub</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#16161a; --panel2:#1d1d22; --line:#2a2a31;
  --text:#f7f5ef; --muted:#9999a5; --gold:#c8941a; --gold2:#e4bd61; --danger:#ef7676;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100dvh;background:
radial-gradient(circle at 50% -10%,rgba(200,148,26,.18),transparent 34%),
linear-gradient(180deg,#0b0b0d 0%,#111114 100%)}
button,input{font:inherit}
.shell{width:min(100%,560px);margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}
.lock-wrap{min-height:88dvh;display:grid;place-items:center}
.lock-card{width:100%;background:rgba(22,22,26,.97);border:1px solid var(--line);border-top:3px solid var(--gold);
border-radius:24px;padding:28px 20px;box-shadow:0 20px 70px rgba(0,0,0,.38)}
.brandmark{width:66px;height:66px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;
background:linear-gradient(145deg,var(--gold2),#8d671e);color:#15110a;font-size:31px;font-weight:900;
box-shadow:0 12px 34px rgba(200,148,26,.18)}
.lock-card h1{text-align:center;margin:0;font-size:26px;letter-spacing:.03em}
.lock-card p{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin:9px 0 22px}
.pw{width:100%;height:56px;border:1px solid var(--line);border-radius:16px;background:#0f0f12;color:#fff;
text-align:center;letter-spacing:.22em;font-size:19px;outline:none;padding:0 16px}
.pw:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,148,26,.12)}
.primary{width:100%;height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));
color:#17130b;font-weight:900;font-size:16px;margin-top:12px}
.error{height:20px;color:var(--danger);text-align:center;font-size:12px;margin-top:10px}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 22px}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--gold2);font-weight:800}
.title{font-size:29px;font-weight:900;margin-top:3px}
.lockbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:8px 12px;font-size:12px}
.hero{background:linear-gradient(145deg,#1d1a14,#151518);border:1px solid #403721;border-radius:22px;padding:20px;margin-bottom:16px}
.hero strong{font-size:17px}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.tool{position:relative;min-height:190px;padding:18px;background:linear-gradient(160deg,var(--panel2),#141417);
border:1px solid var(--line);border-radius:22px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;
justify-content:space-between;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.tool:active{transform:scale(.985)}
.tool:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-34px;top:-34px;background:rgba(200,148,26,.08)}
.icon{width:49px;height:49px;border-radius:15px;background:#262219;border:1px solid #4d4026;display:grid;place-items:center;font-size:24px}
.tool strong{display:block;font-size:17px;line-height:1.35;margin-bottom:6px}
.tool span{display:block;color:var(--muted);font-size:11px;line-height:1.55}
.arrow{color:var(--gold2);font-size:19px;margin-top:9px}
.add{border-style:dashed;opacity:.62}
.add .icon{background:#19191d;border-color:#34343b;color:var(--muted)}
.note{text-align:center;color:#61616b;font-size:10px;line-height:1.7;margin-top:24px}
@media(max-width:380px){.grid{grid-template-columns:1fr}.tool{min-height:154px}}
</style>
</head>
<body>
<div class="shell">
<section id="homeScreen" class="screen active">
    <div class="topbar">
      <div><div class="eyebrow">PRIVATE TOOL PORTAL</div><div class="title">ホーム</div></div>
    </div>

    <div class="hero">
      <strong>業務ツール一覧</strong>
      <p>必要なツールを選択してください。今後、新しいツールはこのホームへ追加できます。</p>
    </div>

    <div class="grid">
      <a class="tool" href="./formatter.html?v=20260830-god-rate-update">
        <div class="icon">⌨️</div>
        <div><strong>パチスロ<br>フォーマッター</strong><span>シート入力を解析して<br>出力データを自動生成</span><div class="arrow">→</div></div>
      </a>

      <a class="tool" href="./karakuri2.html?v=20260819-detailfix">
        <div class="icon">🎪</div>
        <div><strong>からサー2<br>判定ツール</strong><span>一枚絵・ワイプ・ステージから<br>続行ラインを判定</span><div class="arrow">→</div></div>
      </a>

      <a class="tool" href="./dashboard.html?v=20260821-day-week-month-all">
        <div class="icon">📊</div>
        <div><strong>稼働<br>ダッシュボード</strong><span>実収支・期待値・エクセル収支を<br>カレンダーで自動集計</span><div class="arrow">→</div></div>
      </a>
    </div>

    <div class="note">GitHub Pages対応</div>
  </section>
</div>


</body>
</html>
