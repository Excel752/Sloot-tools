    const lbl = tok.replace(/[0-9]/g, "").toLowerCase();
    const hasCZ = /cz/.test(lbl);
    const hasAT = /at|エピ|引き/.test(lbl);
    let part = hasCZ && hasAT ? "#1#2" : hasCZ ? "#1" : "#2";
    let suffix = "";
    if (hasCZ && hasAT) {
      const ren = rens[ri] !== undefined ? rens[ri] : 1;
      suffix = ren >= 3 ? `###${ren - 1}` : "";
      ri++;
    } else if (hasAT) {
      const ren = rens[ri] !== undefined ? rens[ri] : 1;
      suffix = ren >= 2 ? `###${ren}` : "";
      ri++;
    } else if (!hasCZ) {
      const ren = rens[ri] !== undefined ? rens[ri] : 1;
      suffix = ren >= 2 ? `###${ren}` : "";
      ri++;
    }
    return `${g}${part}${suffix}`;
  });
  return [yameLine, ...lines.reverse()].join("\n");
}
function buildHistoryTekken(r) {
  const yame2 = r.yame2 !== undefined ? r.yame2 : r.yame || "";
  const yameLine = `${r.yame !== undefined ? r.yame : ""}#0(${yame2})`;
  const hits = r.tekkenHits || [];
  const rens = r.rens || [];
  let ri = 0;
  const lines = hits.map(({
    g,
    type
  }) => {
    if (type === "both") {
      const ren = rens[ri] !== undefined ? rens[ri] : 1;
      ri++;
      return ren >= 3 ? `${g}#1#2###${ren - 1}` : `${g}#1#2`;
    }
    if (type === "rush") {
      const ren = rens[ri] !== undefined ? rens[ri] : 1;
      ri++;
      return ren >= 2 ? `${g}#2###${ren}` : `${g}#2`;
    }
    return `${g}#1`;
  });
  return [yameLine, ...lines.reverse()].join("\n");
}
function buildHistoryGod(r) {
  const yameLine = `${r.yame !== undefined ? r.yame : ""}#0`;
  const tokens = (r.hitsRaw || "").split("#").map(s => s.trim()).filter(s => /\d/.test(s));
  const rens = r.rens || [];
  if (!tokens.length) return yameLine;
  const lines = tokens.map((tok, i) => {
    const g = parseInt(tok.replace(/[^0-9]/g, ""));
    const ren = rens[i] !== undefined ? rens[i] : 1;
    return ren >= 2 ? `${g}#1#2###${ren}` : `${g}#1#2`;
  });
  return [yameLine, ...lines.reverse()].join("\n");
}

function buildHistoryEnen(r) {
  const yameLine = `${r.yame !== undefined ? r.yame : ""}#0`;
  const tokens = (r.enenHitsRaw || "").split("#").map(x=>x.trim()).filter(Boolean);
  const lines = tokens.map(tok => {
    const m = tok.match(/^(\d+)\s*(rb|bb)/i);
    if (!m) return "";
    return `${parseInt(m[1])}#${m[2].toLowerCase()==="rb" ? 1 : 2}`;
  }).filter(Boolean).reverse();
  return [yameLine, ...lines].join("\n");
}


function buildHistoryMadomagi(r) {
  const yameLine = `${r.yame !== undefined ? r.yame : ""}#0`;
  const tokens = (r.madomagiHitsRaw || "").split("#").map(s => s.trim()).filter(Boolean);
  const rens = r.rens || [];
  let atIndex = 0;

  const lines = tokens.map(tok => {
    const m = tok.match(/^(\d+)\s*(rb|reg|レグ|バケ|みたま|bb|big|at|ラッシュ|エピ|エピソード|えぴ|えぴそーど|エピボ|えぴぼ)/i);
    if (!m) return "";
    const g = parseInt(m[1]);
    const rawType = m[2].toLowerCase();
    const rbAliases = ["rb", "reg", "レグ", "バケ", "みたま"];
    const bbAliases = ["bb", "big"];
    const atAliases = ["at", "ラッシュ", "エピ", "エピソード", "えぴ", "えぴそーど", "エピボ", "えぴぼ"];

    if (rbAliases.includes(rawType)) return `${g}#1`;
    if (bbAliases.includes(rawType)) return `${g}#2`;

    // ATのみ「連荘」を使用。例: 連荘3 → 90#3###2
    if (!atAliases.includes(rawType)) return "";
    const ren = rens[atIndex] !== undefined ? rens[atIndex] : 1;
    atIndex++;
    return ren >= 3 ? `${g}#3###${ren - 1}` : `${g}#3`;
  }).filter(Boolean);

  return [yameLine, ...lines.reverse()].join("\n");
}

function checkMissing(r, machine) {

  if (r.zandama === undefined) miss.push("抜け");
  if (r.cash === undefined) miss.push("現金");
  if (r.yame === undefined) miss.push("ヤメ");
  if (machine === "hokuto" && r.get === undefined) miss.push("獲得");
  if (machine === "ghoul" && !r.watari) {
    if (!r.ghoulMode) miss.push("状態（リセ or AT間）");
    if (r.ghoulThru === undefined) miss.push("スルー回数");
    if (r.ghoulPrevG === undefined) miss.push("天井消化");
  }
  if (machine === "tekken" && r.tekkenThru === undefined) miss.push("スルー回数");
  if (machine === "madomagi") {
    if (!r.madomagiMode) miss.push("状態（リセ or AT間）");
    if (r.madomagiThru === undefined) miss.push("スルー回数");
    if (r.madomagiCurrentG === undefined) miss.push("現在ボナ間G");
    if (r.madomagiMode === "at" && (r.madomagiThru === 3 || r.madomagiThru === 4) && r.madomagiPrevG === undefined) {
      miss.push("括弧内の前回までAT間G");
    }
  }
  if (machine === "karakuri2" && !r.karakuri2Type) miss.push("判定文言（赤いボール / リセ、AT後3スルー / リセ、AT後4スルー）");

  return miss;
}
